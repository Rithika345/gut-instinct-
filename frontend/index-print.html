<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gut Instinct — Pharmacomicrobiomics CDS</title>
  <script>
    (function(){
      var t = localStorage.getItem('gi-theme');
      if (!t) t = 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;300;400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    /* ─────────────────────────────────────────────────────────────────────────
       TOKENS
       ───────────────────────────────────────────────────────────────────────── */
    :root {
      --f-sans: 'Lexend', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --f-serif: 'Spectral', Georgia, 'Times New Roman', serif;
      --f-display: var(--f-sans);

      /* Bright, saturated palette for charts & legends */
      --c-green:  #34A853;
      --c-amber:  #F2A33B;
      --c-red:    #E5453B;
      --c-blue:   #2D7CE5;
      --c-magenta:#C73AAE;
      --c-teal:   #1FA89C;
      --c-orange: #F3743A;

      --r-sm: 10px;
      --r-md: 16px;
      --r-lg: 22px;
    }

    [data-theme="light"] {
      --bg:        #F8F4FB;        /* very pale lilac */
      --bg-deep:   #F2ECF7;        /* slightly deeper lilac */
      --surface:   #FFFFFF;
      --surface-2: #FCFAFD;
      --ink:       #1D1D1F;        /* primary — high contrast */
      --ink-2:     #3C3C43;        /* secondary */
      --ink-3:     #6E6E73;        /* tertiary */
      --ink-4:     #AEAEB2;        /* muted */
      --rule:      #E8DFF0;
      --rule-soft: #F1ECF6;
      --hairline:  rgba(60, 60, 67, 0.10);
      --accent:    #6B4FBB;
      --accent-2:  #8B70D4;
      --accent-wash: #EFE9FA;
      --green-bg:  #EAF6EC;
      --amber-bg:  #FDF1DD;
      --red-bg:    #FBE3E1;
      --shadow-sm: 0 1px 2px rgba(28, 27, 44, 0.04);
      --shadow-md: 0 4px 18px rgba(28, 27, 44, 0.06);
      --shadow-lg: 0 12px 40px rgba(28, 27, 44, 0.08);
    }
    [data-theme="dark"] {
      --bg:        #1A1626;
      --bg-deep:   #14101F;
      --surface:   #221C32;
      --surface-2: #1E1929;
      --ink:       #F5F2FA;
      --ink-2:     #C8C2D4;
      --ink-3:     #8C859B;
      --ink-4:     #585268;
      --rule:      rgba(245, 242, 250, 0.10);
      --rule-soft: rgba(245, 242, 250, 0.06);
      --hairline:  rgba(245, 242, 250, 0.10);
      --accent:    #B7A4F0;
      --accent-2:  #9683D8;
      --accent-wash: rgba(183, 164, 240, 0.12);
      --green-bg:  rgba(52, 168, 83, 0.14);
      --amber-bg:  rgba(242, 163, 59, 0.14);
      --red-bg:    rgba(229, 69, 59, 0.14);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 18px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.45);
      --c-green:  #4FBE7A;
      --c-amber:  #F0A050;
      --c-red:    #F0644E;
      --c-blue:   #6B9DEC;
      --c-magenta:#DC6FB7;
      --c-teal:   #4ABAB0;
      --c-orange: #FA8359;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       RESET
       ───────────────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--f-sans);
      font-weight: 400;
      font-size: 16px;
      line-height: 1.55;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: 0.002em;
      transition: background 0.25s, color 0.25s;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.15s;
    }
    a:hover { opacity: 0.75; }
    button { cursor: pointer; font: inherit; background: none; border: none; color: inherit; }
    em, i { font-family: var(--f-serif); font-style: italic; font-weight: 400; color: inherit; }
    strong { font-weight: 600; color: var(--ink); }

    /* ─────────────────────────────────────────────────────────────────────────
       PAGE FRAME
       ───────────────────────────────────────────────────────────────────────── */
    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       TOP BAR — Apple-style sticky translucent
       ───────────────────────────────────────────────────────────────────────── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--hairline);
      max-width: none;
      margin: 0;
      padding: 0;
    }
    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 32px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      height: 56px;
    }
    .topbar-brand {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 19px; font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .topbar-mark {
      width: 22px; height: 22px;
      background: var(--accent);
      border-radius: 6px;
      position: relative;
    }
    .topbar-mark::after {
      content: ""; position: absolute;
      inset: 5px;
      background: var(--bg);
      border-radius: 2px;
    }
    .topbar-nav { display: flex; align-items: center; gap: 4px; }
    .topbar-link {
      font-size: 14px; font-weight: 500;
      color: var(--ink-2);
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }
    .topbar-link:hover { background: var(--rule-soft); color: var(--ink); opacity: 1; }
    .topbar-toggle {
      font-size: 13.5px; font-weight: 500;
      color: var(--ink-2);
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }
    .topbar-toggle:hover { background: var(--rule-soft); color: var(--ink); }

    /* ─────────────────────────────────────────────────────────────────────────
       HERO / HEADER
       ───────────────────────────────────────────────────────────────────────── */
    .hero {
      padding: 100px 0 80px;
      text-align: center;
    }
    .hero-eyebrow {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 22px;
    }
    .hero-title {
      font-family: var(--f-sans);
      font-weight: 300;
      font-size: clamp(56px, 9vw, 104px);
      letter-spacing: -0.035em;
      line-height: 1;
      color: var(--ink);
      margin-bottom: 24px;
    }
    .hero-title em {
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 300;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, var(--accent) 0%, #B086E5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding-right: 0.04em;
    }
    .hero-dek {
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(20px, 2.2vw, 26px);
      line-height: 1.4;
      color: var(--ink-2);
      max-width: 680px;
      margin: 0 auto 40px;
      letter-spacing: 0;
      text-wrap: balance;
    }
    .hero-byline {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
      line-height: 1.7;
    }
    .hero-byline strong { color: var(--ink-2); font-weight: 500; letter-spacing: 0.14em; }
    .hero-byline .sep { display: inline-block; padding: 0 8px; color: var(--ink-4); }

    /* ─────────────────────────────────────────────────────────────────────────
       SECTION
       ───────────────────────────────────────────────────────────────────────── */
    .section {
      padding: 80px 0;
    }
    .section + .section {
      border-top: 1px solid var(--hairline);
    }
    .section-head {
      margin-bottom: 48px;
    }
    .section-eyebrow {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 16px;
    }
    .section-title {
      font-weight: 300;
      font-size: clamp(34px, 4.4vw, 50px);
      letter-spacing: -0.025em;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 18px;
      text-wrap: balance;
    }
    .section-title em {
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 300;
      color: var(--accent);
      background: none;
      -webkit-text-fill-color: var(--accent);
    }
    .section-lede {
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 20px;
      line-height: 1.5;
      color: var(--ink-2);
      max-width: 660px;
      letter-spacing: 0;
      text-wrap: pretty;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       ABSTRACT — calm single-column prose
       ───────────────────────────────────────────────────────────────────────── */
    .prose {
      max-width: 720px;
      font-size: 17px;
      line-height: 1.65;
      color: var(--ink-2);
    }
    .prose strong, .prose em { color: var(--ink); }
    .prose p + p { margin-top: 18px; }
    .prose p { text-wrap: pretty; }

    /* Pipeline cards — Apple style */
    .pipeline {
      margin-top: 48px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .pipeline-step {
      padding: 24px 22px 26px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .pipeline-step:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-2);
    }
    .pipeline-num {
      font-size: 10.5px; font-weight: 500;
      color: var(--ink-3);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .pipeline-name {
      font-size: 19px; font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.018em;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .pipeline-desc {
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink-2);
      text-wrap: pretty;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       CASES — generous list
       ───────────────────────────────────────────────────────────────────────── */
    .cases {
      display: flex; flex-direction: column;
      gap: 12px;
    }
    .case {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 24px;
      align-items: center;
      padding: 24px 28px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      text-align: left;
      width: 100%;
    }
    .case:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-2);
    }
    .case[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-wash);
      box-shadow: var(--shadow-md);
    }
    .case:disabled { cursor: wait; opacity: 0.55; transform: none; box-shadow: var(--shadow-sm); }

    .case-num {
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 38px; font-weight: 300;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.01em;
      text-align: center;
    }
    .case-body { display: flex; flex-direction: column; gap: 8px; }
    .case-diag {
      font-size: 22px; font-weight: 400;
      line-height: 1.2;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .case-desc {
      font-size: 15px; line-height: 1.5;
      color: var(--ink-2);
      max-width: 580px;
      text-wrap: pretty;
    }
    .case-meta {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-top: 6px;
    }
    .case-action {
      font-size: 15px; font-weight: 500;
      color: var(--accent);
      display: inline-flex; align-items: center; gap: 8px;
      white-space: nowrap;
    }
    .case-action-arrow { transition: transform 0.18s; display: inline-block; }
    .case:hover .case-action-arrow { transform: translateX(4px); }
    .case-action--running { color: var(--ink-3); }

    /* ─────────────────────────────────────────────────────────────────────────
       TAGS / BADGES (with bright color)
       ───────────────────────────────────────────────────────────────────────── */
    .tag {
      display: inline-block;
      font-family: var(--f-sans);
      font-size: 12px; font-weight: 500;
      letter-spacing: 0.01em;
      padding: 3px 9px;
      border: 1px solid var(--rule);
      color: var(--ink-2);
      background: var(--surface);
    }
    .tag {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.04em;
      padding: 3px 9px;
      border-radius: 999px;
      color: var(--ink-2);
      background: var(--rule-soft);
      line-height: 1.5;
      border: none;
    }
    .tag--accent { color: var(--accent); background: var(--accent-wash); }
    .tag--green  { color: var(--c-green); background: var(--green-bg); }
    .tag--amber  { color: var(--c-amber); background: var(--amber-bg); }
    .tag--red    { color: var(--c-red);   background: var(--red-bg); }

    /* ─────────────────────────────────────────────────────────────────────────
       PIPELINE PROGRESS
       ───────────────────────────────────────────────────────────────────────── */
    .progress {
      margin: 24px 0 0;
      padding: 24px 28px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-sm);
    }
    .progress-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 18px;
    }
    .progress-title {
      font-size: 10.5px; font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .progress-stage {
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 16px; font-weight: 400;
      color: var(--accent);
      letter-spacing: 0;
    }
    .progress-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .progress-step {
      padding: 14px 14px;
      background: var(--bg-deep);
      border-radius: var(--r-sm);
      transition: background 0.2s ease;
    }
    .progress-step--done    { background: var(--green-bg); }
    .progress-step--active  { background: var(--accent-wash); }
    .progress-num {
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 6px;
    }
    .progress-step--done .progress-num { color: var(--c-green); }
    .progress-step--active .progress-num { color: var(--accent); }
    .progress-label {
      font-size: 14.5px; font-weight: 500; line-height: 1.3;
      color: var(--ink-3);
      letter-spacing: -0.005em;
    }
    .progress-step--done .progress-label, .progress-step--active .progress-label {
      color: var(--ink);
    }
    .progress-step--active {
      animation: pulse-bg 1.4s ease-in-out infinite;
    }
    @keyframes pulse-bg {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.72; }
    }

    /* ─────────────────────────────────────────────────────────────────────────
       RESULTS SHELL
       ───────────────────────────────────────────────────────────────────────── */
    .results {
      margin-top: 64px;
      padding-top: 64px;
      border-top: 1px solid var(--hairline);
      animation: fade-up 0.5s ease both;
    }
    @keyframes fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .results-eyebrow {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 14px;
    }
    .results-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
    }
    .results-pid {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 12px;
    }
    .results-pid strong { color: var(--accent); font-weight: 500; letter-spacing: 0.14em; }
    .results-title {
      font-weight: 300;
      font-size: clamp(36px, 5vw, 56px);
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--ink);
      text-wrap: balance;
    }
    .results-source {
      font-size: 10.5px; font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .source-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .results-source--live { color: var(--c-green); background: var(--green-bg); }
    .results-source--live .source-dot { background: var(--c-green); animation: blink 1.6s ease-in-out infinite; }
    .results-source--sim  { color: var(--accent); background: var(--accent-wash); }
    .results-source--sim .source-dot { background: var(--accent); }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .results-summary {
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 22px;
      line-height: 1.4;
      color: var(--ink-2);
      max-width: 760px;
      letter-spacing: 0;
      text-wrap: pretty;
      margin-bottom: 40px;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       TABS
       ───────────────────────────────────────────────────────────────────────── */
    .tabs {
      display: inline-flex; gap: 2px;
      padding: 4px;
      background: var(--bg-deep);
      border-radius: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      max-width: 100%;
    }
    .tab {
      font-size: 14px; font-weight: 500;
      padding: 8px 14px;
      color: var(--ink-2);
      border-radius: 8px;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
      letter-spacing: -0.005em;
    }
    .tab:hover { color: var(--ink); }
    .tab--active {
      background: var(--surface);
      color: var(--ink);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(28, 27, 44, 0.08);
    }

    /* ─────────────────────────────────────────────────────────────────────────
       CLINICAL REPORT — single column, generous
       ───────────────────────────────────────────────────────────────────────── */
    .report { display: flex; flex-direction: column; gap: 56px; }

    .panel-head {
      font-size: 26px; font-weight: 300;
      letter-spacing: -0.022em;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .panel-head em {
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 300;
      color: var(--accent);
    }
    .panel-sub {
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 16px;
      color: var(--ink-3);
      margin-bottom: 24px;
    }

    .legend {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      margin-bottom: 24px;
      font-size: 14px;
      color: var(--ink-2);
    }
    .legend-note {
      color: var(--ink-3); margin-left: 4px;
      font-size: 14px;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       DRUG ENTRY
       ───────────────────────────────────────────────────────────────────────── */
    .drug {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      padding: 22px 24px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.18s;
    }
    .drug:hover { box-shadow: var(--shadow-md); }
    .drug-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }
    .drug-left { display: flex; flex-direction: column; gap: 8px; }
    .drug-name {
      font-size: 24px; font-weight: 400;
      letter-spacing: -0.022em;
      line-height: 1.1;
      color: var(--ink);
    }
    .drug-tier-row { display: flex; align-items: center; gap: 10px; }
    .drug-right {
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    }
    .drug-score-num {
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 36px; font-weight: 300;
      letter-spacing: -0.015em;
      line-height: 1;
    }
    .drug-score-num small {
      font-size: 14px; font-weight: 500;
      color: var(--ink-3);
      letter-spacing: -0.01em;
    }
    .score-track {
      width: 160px; height: 6px;
      background: var(--rule-soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .score-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.6s ease;
    }
    .drug-toggle {
      font-size: 14px; font-weight: 500;
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--accent-wash);
      margin-top: 16px;
      transition: opacity 0.15s;
    }
    .drug-toggle:hover { opacity: 0.7; }

    .drug-oneliner {
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 18px; line-height: 1.5;
      color: var(--ink-2);
      margin-top: 14px;
      max-width: 720px;
      text-wrap: pretty;
    }
    .drug-details {
      margin-top: 22px;
      padding-top: 22px;
      border-top: 1px solid var(--hairline);
      animation: fade-up 0.3s ease;
    }
    .drug-explanation {
      font-size: 16px; line-height: 1.6;
      color: var(--ink);
      margin-bottom: 24px;
      text-wrap: pretty;
    }
    .drug-subhead {
      font-size: 10.5px; font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin: 24px 0 10px;
    }
    .drug-subhead:first-child { margin-top: 0; }
    .interaction {
      padding: 14px 16px;
      background: var(--bg-deep);
      border-radius: var(--r-sm);
      margin-bottom: 8px;
    }
    .interaction-desc {
      font-size: 15px; font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .interaction-implication {
      font-size: 14.5px; line-height: 1.5;
      color: var(--ink-2);
    }
    .interaction-implication::before {
      content: "→ "; color: var(--accent); font-weight: 600;
    }
    .interaction-taxa {
      font-size: 13px;
      color: var(--ink-3);
      margin-top: 6px;
    }
    .risk-flag {
      font-size: 14.5px; line-height: 1.5;
      color: var(--c-red);
      padding: 12px 16px;
      background: var(--red-bg);
      border-radius: var(--r-sm);
      margin-bottom: 8px;
      font-weight: 500;
    }
    .risk-flag::before { content: "⚠︎  "; font-weight: 700; }
    .clinical-guidance {
      font-size: 15px; line-height: 1.55;
      color: var(--ink);
      padding: 14px 16px;
      background: var(--accent-wash);
      border-radius: var(--r-sm);
    }

    /* ─────────────────────────────────────────────────────────────────────────
       MICROBIOME CONTEXT (single column)
       ───────────────────────────────────────────────────────────────────────── */
    .mb-summary {
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 18px; line-height: 1.5;
      color: var(--ink-2);
      margin-bottom: 24px;
      max-width: 760px;
      text-wrap: pretty;
    }
    .mb-taxa {
      display: flex; flex-direction: column;
      gap: 8px;
    }
    .mb-taxon {
      padding: 18px 22px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-sm);
    }
    .mb-taxon-name {
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 19px; font-weight: 400;
      color: var(--ink);
      display: block;
      margin-bottom: 4px;
      letter-spacing: 0;
    }
    .mb-taxon-concern {
      font-size: 15px; line-height: 1.5;
      color: var(--ink-2);
      display: block;
    }
    .mb-taxon-drugs {
      font-size: 13.5px;
      color: var(--accent);
      margin-top: 8px;
      display: block;
      font-weight: 500;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       CAVEATS / DISCLAIMER
       ───────────────────────────────────────────────────────────────────────── */
    .caveat {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 12px;
      padding: 14px 0;
      border-top: 1px solid var(--hairline);
      font-size: 14.5px; line-height: 1.55;
      color: var(--ink-2);
    }
    .caveat:last-child { border-bottom: 1px solid var(--hairline); }
    .caveat-num {
      font-size: 14.5px; font-weight: 600;
      color: var(--accent);
      line-height: 1.55;
    }
    .disclaimer {
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 15px; line-height: 1.55;
      color: var(--ink-3);
      padding: 20px 24px;
      background: var(--bg-deep);
      border-radius: var(--r-sm);
      text-align: center;
      max-width: 760px;
      margin: 32px auto 0;
      text-wrap: pretty;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       CHART SHARED
       ───────────────────────────────────────────────────────────────────────── */
    .chart-intro {
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 17px; line-height: 1.55;
      color: var(--ink-2);
      max-width: 720px;
      margin-bottom: 32px;
      text-wrap: pretty;
    }
    .chart-intro em { font-style: italic; font-weight: 500; color: var(--ink); }

    /* ─────────────────────────────────────────────────────────────────────────
       SCORES CHART (bright colors)
       ───────────────────────────────────────────────────────────────────────── */
    .scores { display: flex; flex-direction: column; gap: 8px; }
    .score-row {
      display: grid;
      grid-template-columns: 36px 200px 1fr 110px;
      gap: 18px;
      align-items: center;
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-sm);
    }
    .score-rank {
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 22px; font-weight: 300;
      color: var(--accent);
      letter-spacing: -0.01em;
    }
    .score-drug {
      font-size: 18px; font-weight: 400;
      color: var(--ink);
      letter-spacing: -0.018em;
    }
    .score-stack {
      height: 10px;
      display: flex;
      background: var(--rule-soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .score-seg-enz { background: var(--c-blue); }
    .score-seg-gus { background: var(--c-amber); }
    .score-end {
      display: flex; align-items: center; gap: 12px;
      justify-content: flex-end;
    }
    .score-end-num {
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 22px; font-weight: 300;
      letter-spacing: -0.01em;
    }
    .score-legend {
      margin-top: 24px;
      display: flex; flex-wrap: wrap; gap: 24px; align-items: center;
      font-size: 14px;
      color: var(--ink-2);
    }
    .legend-swatch {
      display: inline-flex; align-items: center; gap: 8px;
    }
    .legend-box {
      width: 18px; height: 12px;
      display: inline-block;
    }
    .score-legend-note {
      flex-basis: 100%;
      font-family: var(--f-serif); font-style: italic;
      font-size: 14.5px;
      color: var(--ink-3);
    }

    /* ─────────────────────────────────────────────────────────────────────────
       TAXA CHART (bright phylum colors)
       ───────────────────────────────────────────────────────────────────────── */
    .taxa { display: flex; flex-direction: column; gap: 0; }
    .phyla-legend {
      display: flex; flex-wrap: wrap; gap: 8px 18px;
      margin-bottom: 24px;
      font-family: var(--f-sans); font-size: 14px;
      color: var(--ink-2);
    }
    .phyla-legend-item { display: inline-flex; align-items: center; gap: 8px; }
    .phyla-legend-dot {
      width: 14px; height: 14px;
      display: inline-block;
    }
    .taxon-row {
      display: grid;
      grid-template-columns: 280px 1fr 64px;
    .taxa { display: flex; flex-direction: column; gap: 6px; }
    .phyla-legend {
      display: flex; flex-wrap: wrap; gap: 8px 18px;
      margin-bottom: 24px;
      font-size: 14px;
      color: var(--ink-2);
    }
    .phyla-legend-item { display: inline-flex; align-items: center; gap: 8px; }
    .phyla-legend-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .taxon-row {
      display: grid;
      grid-template-columns: 260px 1fr 64px;
      gap: 20px;
      align-items: center;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-sm);
    }
    .taxon-left {
      display: flex; flex-direction: column; gap: 6px;
    }
    .taxon-name {
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 17px; font-weight: 400;
      color: var(--ink);
      letter-spacing: 0;
    }
    .taxon-meta {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .taxon-bar-track {
      height: 10px;
      background: var(--rule-soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .taxon-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s ease;
    }
    .taxon-pct {
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 17px; font-weight: 400;
      color: var(--ink-2);
      text-align: right;
      letter-spacing: 0;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       NETWORK GRAPH
       ───────────────────────────────────────────────────────────────────────── */
    .network-wrap { display: flex; flex-direction: column; gap: 16px; }
    .network-svg-container {
      padding: 24px 16px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .network-legend {
      display: flex; flex-wrap: wrap; gap: 20px; align-items: center;
      font-size: 14px;
      color: var(--ink-2);
    }

    /* ─────────────────────────────────────────────────────────────────────────
       STRUCTURAL EVIDENCE — NO COLOR BACKGROUND BEHIND PROTEIN
       ───────────────────────────────────────────────────────────────────────── */
    .struct-wrap { display: flex; flex-direction: column; gap: 18px; }
    .struct-controls {
      display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-sm);
    }
    .struct-controls label {
      font-size: 13px; font-weight: 600;
      color: var(--ink-2);
    }
    .struct-select {
      flex: 1; min-width: 320px;
      background: var(--bg-deep);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.008em;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%236E6E73' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 12px;
      padding-right: 36px;
      transition: background 0.15s;
    }
    .struct-select:hover { background-color: var(--rule); }
    .struct-select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* The 3D protein viewer — NO surrounding card / background / border */
    .struct-viewer {
      position: relative; width: 100%; height: 500px;
      background: transparent;
      overflow: visible;
    }
    .struct-viewer-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--ink-3); font-size: 15px;
    }
    /* 3Dmol internally sets a bg on a child canvas — keep it transparent */
    .struct-viewer canvas { background: transparent !important; }

    .struct-legend-row {
      display: flex; flex-wrap: wrap; gap: 16px 32px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-sm);
      font-size: 14.5px;
    }
    .struct-legend-item { display: flex; align-items: center; gap: 10px; }
    .struct-legend-swatch { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
    .struct-legend-item strong { font-weight: 600; color: var(--ink); }
    .struct-legend-item span { color: var(--ink-3); }

    .struct-metrics {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      background: transparent;
      border: none;
    }
    .struct-metric {
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-sm);
    }
    .struct-metric-label {
      font-size: 10.5px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 10px;
    }
    .struct-metric-value {
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 30px; font-weight: 300;
      letter-spacing: -0.015em;
      color: var(--ink);
      line-height: 1;
    }
    .struct-metric-value--green { color: var(--c-green); }
    .struct-metric-value--amber { color: var(--c-amber); }
    .struct-metric-value--red { color: var(--c-red); }
    .verdict {
      display: inline-block;
      font-size: 10.5px; font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 999px;
      margin-top: 2px;
    }
    .verdict--match, .verdict--same { color: var(--c-green); background: var(--green-bg); }
    .verdict--partial { color: var(--c-amber); background: var(--amber-bg); }
    .verdict--none { color: var(--c-red); background: var(--red-bg); }

    .struct-narrative {
      padding: 18px 22px;
      background: var(--accent-wash);
      border-radius: var(--r-sm);
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 400;
      font-size: 17px; line-height: 1.55;
      color: var(--ink);
      text-wrap: pretty;
    }
    .struct-interp {
      padding: 18px 22px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-sm);
      font-size: 15px; line-height: 1.55;
      color: var(--ink-2);
      text-wrap: pretty;
    }
    .struct-cite {
      padding: 16px 20px;
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 13.5px; line-height: 1.6;
      color: var(--ink-3);
    }
    .struct-cite strong { font-style: normal; font-family: var(--f-sans); font-weight: 500; color: var(--ink-2); }

    /* ─────────────────────────────────────────────────────────────────────────
       RAW
       ───────────────────────────────────────────────────────────────────────── */
    .raw-wrap { display: flex; flex-direction: column; gap: 10px; }
    .raw-row {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .raw-header {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      text-align: left;
    }
    .raw-name {
      font-size: 17px; font-weight: 400;
      color: var(--ink);
      letter-spacing: -0.018em;
    }
    .raw-name small {
      display: block;
      font-size: 13px;
      color: var(--ink-3);
      font-weight: 400;
      margin-top: 4px;
      letter-spacing: 0;
    }
    .raw-toggle {
      font-size: 13.5px; font-weight: 500;
      color: var(--accent);
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--accent-wash);
      transition: opacity 0.15s;
    }
    .raw-toggle:hover { opacity: 0.7; }
    .raw-body {
      padding: 18px 22px;
      background: var(--bg-deep);
      border-top: 1px solid var(--hairline);
      font-family: ui-monospace, 'SF Mono', 'Menlo', Consolas, monospace;
      font-size: 12.5px; line-height: 1.65;
      color: var(--ink-2);
      max-height: 460px;
      overflow: auto;
      white-space: pre;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       FOOTER
       ───────────────────────────────────────────────────────────────────────── */
    .footer {
      margin-top: 80px;
      padding: 48px 0 56px;
      border-top: 1px solid var(--hairline);
      text-align: center;
    }
    .footer-mark {
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 22px; font-weight: 300;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 10px;
    }
    .footer-text {
      font-size: 13.5px;
      color: var(--ink-3);
      max-width: 540px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .footer-text strong { color: var(--ink-2); font-weight: 600; }

    /* ─────────────────────────────────────────────────────────────────────────
       TWEAKS PANEL
       ───────────────────────────────────────────────────────────────────────── */
    .tweaks {
      position: fixed; bottom: 28px; right: 28px; z-index: 999;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-lg);
      width: 300px;
      animation: fade-up 0.3s ease;
    }
    .tweaks-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--hairline);
      display: flex; align-items: center; justify-content: space-between;
    }
    .tweaks-title {
      font-size: 10.5px; font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .tweaks-close {
      width: 24px; height: 24px;
      border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-3);
      font-size: 18px;
      transition: background 0.15s, color 0.15s;
    }
    .tweaks-close:hover { color: var(--ink); background: var(--rule-soft); }
    .tweaks-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }
    .tweak-row { display: flex; flex-direction: column; gap: 8px; }
    .tweak-row-head {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 13px; font-weight: 500;
      color: var(--ink-2);
    }
    .tweak-val {
      font-size: 13px; font-weight: 600;
      color: var(--accent);
    }
    .tweak-row input[type=range] {
      width: 100%;
      accent-color: var(--accent);
    }
    .tweak-row select {
      width: 100%;
      background: var(--bg-deep);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%236E6E73' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 11px;
      padding-right: 30px;
    }
    .tweak-row select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* ─────────────────────────────────────────────────────────────────────────
       MISC
       ───────────────────────────────────────────────────────────────────────── */
    .error-msg {
      padding: 14px 18px;
      background: var(--red-bg);
      color: var(--c-red);
      border-radius: var(--r-sm);
      font-size: 15px;
      font-weight: 500;
      margin-top: 20px;
    }
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      font-size: 15px;
      color: var(--ink-3);
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
    }

    /* ─────────────────────────────────────────────────────────────────────────
       RESPONSIVE
       ───────────────────────────────────────────────────────────────────────── */
    @media (max-width: 880px) {
      .page { padding-left: 20px; padding-right: 20px; }
      .topbar-inner { padding-left: 20px; padding-right: 20px; }
      .pipeline { grid-template-columns: 1fr 1fr; }
      .case { grid-template-columns: 56px 1fr; padding: 20px 22px; }
      .case-action { grid-column: 1 / -1; padding-top: 4px; }
      .case-num { font-size: 26px; }
      .case-diag { font-size: 20px; }
      .progress-steps { grid-template-columns: 1fr 1fr; }
      .drug-head { grid-template-columns: 1fr; }
      .drug-right { align-items: flex-start; flex-direction: row; gap: 16px; }
      .score-row { grid-template-columns: 28px 1fr; grid-auto-rows: auto; }
      .score-row .score-stack, .score-row .score-end { grid-column: 1 / -1; }
      .taxon-row { grid-template-columns: 1fr; gap: 6px; }
      .taxon-pct { text-align: left; }
      .struct-metrics { grid-template-columns: 1fr 1fr; }
      .struct-metric { border-right: none; border-bottom: none; }
      .struct-metric:nth-last-child(-n+1) { border-bottom: none; }
      .results-head { flex-direction: column; align-items: flex-start; }
    }
    @media (max-width: 540px) {
      .pipeline { grid-template-columns: 1fr; }
      .progress-steps { grid-template-columns: 1fr; }
      .hero { padding: 40px 0 56px; }
      .struct-metrics { grid-template-columns: 1fr; }
      .struct-metric { border-right: none; }
    }
  
    /* ───── PRINT ───── */
    @media print {
      @page { size: A4 portrait; margin: 1.2cm 1.4cm; }
      :root, body {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      html, body { background: var(--bg) !important; }
      .topbar {
        position: static !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border-bottom: 1px solid var(--rule) !important;
        background: var(--bg) !important;
      }
      .topbar-nav .topbar-toggle, .tweaks { display: none !important; }
      .page { max-width: none !important; padding: 0 !important; }
      .hero { padding: 28px 0 32px !important; break-after: page; }
      .section { padding: 32px 0 !important; break-inside: avoid-page; }
      .section + .section { border-top: 1px solid var(--rule); }
      .section-head { margin-bottom: 24px !important; }
      .pipeline { margin-top: 28px !important; gap: 12px !important; }
      .pipeline-step, .case, .progress, .drug, .mb-taxon, .taxon-row,
      .score-row, .struct-metric, .struct-controls, .struct-legend-row,
      .struct-narrative, .struct-interp, .network-svg-container, .raw-row {
        box-shadow: none !important;
        break-inside: avoid;
      }
      .case { padding: 18px 22px !important; }
      .case-action-arrow { display: none; }
      .case-action::after { content: ""; }
      .footer { margin-top: 40px !important; padding: 24px 0 12px !important; break-before: avoid; }
      /* prevent oversized hero from pushing everything down */
      .hero-title { font-size: 72px !important; }
      .section-title { font-size: 36px !important; }
      /* Make sure gradients render */
      .hero-title em {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      a { color: var(--ink) !important; }
      /* Disable all transitions/animations in print */
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  <script src="demo-data.js"></script>
  <script src="structures.js"></script>
  <script type="text/babel" src="results.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    // Auto-print after fonts + JSX have loaded.
    (function(){
      function go(){ try { window.print(); } catch(e) {} }
      function ready(){
        var fontsP = (document.fonts && document.fonts.ready) || Promise.resolve();
        fontsP.then(function(){ setTimeout(go, 500); });
      }
      if (document.readyState === 'complete') ready();
      else window.addEventListener('load', ready);
    })();
  </script>

</body>
</html>
