<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gut Instinct — Pharmacomicrobiomics CDS</title>
  <script>
    (function(){
      var t = localStorage.getItem('gi-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    /* ── Tokens ── */
    :root {
      --accent-hue: 216;
      --radius: 12px;
      --density-gap: 1.75rem;

      --accent:       oklch(0.55 0.14 var(--accent-hue));
      --accent-light: oklch(0.88 0.07 var(--accent-hue));
      --accent-muted: oklch(0.93 0.04 var(--accent-hue));
      --green:  oklch(0.52 0.14 148);
      --amber:  oklch(0.62 0.14 72);
      --red:    oklch(0.52 0.18 22);
      --green-bg:  oklch(0.96 0.04 148);
      --amber-bg:  oklch(0.97 0.04 72);
      --red-bg:    oklch(0.96 0.05 22);
    }
    [data-theme="light"] {
      --bg:       oklch(0.985 0.007 var(--accent-hue));
      --surface:  #ffffff;
      --surface2: oklch(0.97 0.01 var(--accent-hue));
      --border:   oklch(0.91 0.02 var(--accent-hue));
      --text:     oklch(0.17 0.02 var(--accent-hue));
      --text2:    oklch(0.45 0.03 var(--accent-hue));
      --text3:    oklch(0.62 0.02 var(--accent-hue));
      --shadow:   0 1px 3px oklch(0.7 0.04 var(--accent-hue) / 0.12), 0 4px 16px oklch(0.7 0.04 var(--accent-hue) / 0.06);
      --shadow-sm:0 1px 2px oklch(0.7 0.04 var(--accent-hue) / 0.08);
    }
    [data-theme="dark"] {
      --bg:       oklch(0.12 0.025 var(--accent-hue));
      --surface:  oklch(0.17 0.025 var(--accent-hue));
      --surface2: oklch(0.21 0.025 var(--accent-hue));
      --border:   oklch(0.28 0.025 var(--accent-hue));
      --text:     oklch(0.96 0.008 var(--accent-hue));
      --text2:    oklch(0.72 0.02 var(--accent-hue));
      --text3:    oklch(0.54 0.02 var(--accent-hue));
      --shadow:   0 1px 3px rgba(0,0,0,0.35), 0 4px 16px rgba(0,0,0,0.25);
      --shadow-sm:0 1px 2px rgba(0,0,0,0.25);
      --green-bg:  oklch(0.22 0.06 148);
      --amber-bg:  oklch(0.22 0.06 72);
      --red-bg:    oklch(0.22 0.07 22);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s, color 0.2s;
    }
    a { color: var(--accent); text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }

    /* ── Layout ── */
    .container { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; }

    /* ── Nav ── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: color-mix(in oklch, var(--bg) 85%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 900px; margin: 0 auto; padding: 0 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 56px;
    }
    .nav-logo { display: flex; align-items: center; gap: 0.55rem; }
    .nav-brand { font-weight: 600; font-size: 1rem; letter-spacing: -0.01em; color: var(--text); }
    .nav-actions { display: flex; align-items: center; gap: 1.25rem; }
    .nav-link { font-size: 0.875rem; font-weight: 500; color: var(--text2); transition: color 0.15s; }
    .nav-link:hover { color: var(--accent); }
    .theme-toggle {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 8px; color: var(--text2);
      display: flex; align-items: center; transition: background 0.15s, color 0.15s;
    }
    .theme-toggle:hover { background: var(--accent-muted); color: var(--accent); }

    /* ── Hero ── */
    .hero {
      max-width: 900px; margin: 0 auto;
      padding: 6rem 1.5rem 5rem;
      text-align: center;
    }
    .hero-tag {
      display: inline-block;
      font-size: 0.75rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--accent); background: var(--accent-muted);
      padding: 0.35rem 0.9rem; border-radius: 100px;
      margin-bottom: 1.75rem;
    }
    .hero-headline {
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      font-weight: 300; letter-spacing: -0.03em; line-height: 1.15;
      color: var(--text); margin-bottom: 1.25rem;
      text-wrap: balance;
    }
    .hero-sub {
      font-size: 1.1rem; color: var(--text2); max-width: 560px;
      margin: 0 auto 2.25rem; font-weight: 300; text-wrap: pretty;
    }
    .hero-ctas { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .btn-primary {
      background: var(--accent); color: #fff; border: none;
      padding: 0.7rem 1.6rem; border-radius: var(--radius);
      font-size: 0.9rem; font-weight: 500; letter-spacing: -0.01em;
      transition: opacity 0.15s, transform 0.1s; display: inline-block;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); color: #fff; }
    .btn-ghost {
      background: var(--surface); color: var(--text2); border: 1px solid var(--border);
      padding: 0.7rem 1.6rem; border-radius: var(--radius);
      font-size: 0.9rem; font-weight: 500;
      transition: background 0.15s, color 0.15s; display: inline-block;
    }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .hero-disclaimer { font-size: 0.75rem; color: var(--text3); }

    /* ── Section shared ── */
    .section-label {
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 0.6rem;
    }
    .section-title {
      font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 400; letter-spacing: -0.025em;
      color: var(--text); margin-bottom: 0.75rem;
    }
    .section-sub { font-size: 0.95rem; color: var(--text2); max-width: 540px; font-weight: 300; text-wrap: pretty; }

    /* ── Pipeline ── */
    .pipeline {
      max-width: 900px; margin: 0 auto;
      padding: 4rem 1.5rem;
      border-top: 1px solid var(--border);
    }
    .agents-row {
      display: flex; align-items: flex-start;
      gap: 0; margin-top: 2.5rem;
      flex-wrap: wrap;
    }
    .agent-card {
      flex: 1; min-width: 160px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem 1.1rem;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .agent-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
    .agent-num {
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      color: var(--accent); margin-bottom: 0.5rem; font-weight: 500;
    }
    .agent-name { font-size: 0.875rem; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }
    .agent-desc { font-size: 0.78rem; color: var(--text2); line-height: 1.5; text-wrap: pretty; }
    .agent-arrow {
      padding: 0 0.5rem; font-size: 1.1rem; color: var(--accent-light);
      align-self: center; flex-shrink: 0;
    }

    /* ── Demo section ── */
    .demo-section {
      max-width: 900px; margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
      border-top: 1px solid var(--border);
    }
    .case-cards {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem; margin-top: 2rem;
    }
    .case-card {
      text-align: left; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.5rem; box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, transform 0.15s, border-color 0.15s;
      cursor: pointer;
    }
    .case-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: var(--accent-light); }
    .case-card--selected { border-color: var(--accent); box-shadow: 0 0 0 2px oklch(0.55 0.14 var(--accent-hue) / 0.15), var(--shadow); }
    .case-card:disabled { opacity: 0.6; cursor: default; transform: none; }
    .case-badge {
      display: inline-block; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--accent); background: var(--accent-muted);
      padding: 0.2rem 0.6rem; border-radius: 100px; margin-bottom: 0.75rem;
    }
    .case-label { font-size: 0.9rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
    .case-desc { font-size: 0.8rem; color: var(--text2); line-height: 1.5; margin-bottom: 1rem; }
    .case-run-btn {
      font-size: 0.8rem; font-weight: 500; color: var(--accent);
      display: flex; align-items: center; gap: 0.25rem;
    }

    /* ── Pipeline progress ── */
    .pipeline-progress {
      margin-top: 2rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem 1.75rem;
      display: flex; flex-direction: column; gap: 0.85rem;
    }
    .pp-step { display: flex; align-items: center; gap: 0.75rem; }
    .pp-dot {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; transition: background 0.3s;
    }
    .pp-done .pp-dot { background: var(--green); color: #fff; }
    .pp-active .pp-dot { background: var(--accent-muted); border: 2px solid var(--accent); }
    .pp-waiting .pp-dot { background: var(--surface2); border: 1px solid var(--border); }
    .pp-label { font-size: 0.85rem; }
    .pp-done .pp-label { color: var(--text); font-weight: 500; }
    .pp-active .pp-label { color: var(--accent); font-weight: 500; }
    .pp-waiting .pp-label { color: var(--text3); }
    .pp-spinner {
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--accent); border-top-color: transparent;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Results ── */
    .results { margin-top: 2.5rem; display: flex; flex-direction: column; gap: var(--density-gap); }
    .results-header {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem 1.75rem;
      box-shadow: var(--shadow-sm);
    }
    .results-patient {
      font-family: 'DM Mono', monospace; font-size: 0.75rem;
      color: var(--accent); font-weight: 500; margin-bottom: 0.6rem;
    }
    .results-summary { font-size: 0.95rem; color: var(--text2); line-height: 1.65; text-wrap: pretty; }
    .results-section-title {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text3); margin-bottom: 0.75rem;
    }
    .results-drugs, .results-microbiome, .results-caveats {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem 1.75rem;
      box-shadow: var(--shadow-sm);
    }
    .tier-legend {
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
      margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);
    }
    .tier-legend-note { font-size: 0.75rem; color: var(--text3); margin-left: 0.25rem; }

    /* ── Tier badge ── */
    .tier-badge {
      display: inline-flex; align-items: center;
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0.22rem 0.65rem; border-radius: 100px;
    }
    .tier-green { color: var(--green); background: var(--green-bg); }
    .tier-amber { color: var(--amber); background: var(--amber-bg); }
    .tier-red   { color: var(--red);   background: var(--red-bg); }

    /* ── Drug card ── */
    .drug-card {
      border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px);
      overflow: hidden; margin-bottom: 0.6rem; transition: box-shadow 0.15s;
    }
    .drug-card:last-child { margin-bottom: 0; }
    .drug-card--caution { border-color: oklch(0.52 0.18 22 / 0.3); }
    .drug-card:hover { box-shadow: var(--shadow-sm); }
    .drug-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 1rem; cursor: pointer; gap: 1rem;
      background: var(--surface2);
      transition: background 0.15s;
    }
    .drug-card-header:hover { background: var(--accent-muted); }
    .drug-card-left { display: flex; align-items: center; gap: 0.6rem; }
    .drug-card-right { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    .drug-name { font-size: 0.9rem; font-weight: 600; color: var(--text); }
    .drug-expand { font-size: 1.1rem; color: var(--text3); width: 18px; text-align: center; line-height: 1; }
    .drug-one-liner {
      padding: 0.6rem 1rem; font-size: 0.82rem; color: var(--text2);
      line-height: 1.5; border-top: 1px solid var(--border);
      background: var(--surface);
    }

    /* ── Score bar ── */
    .score-bar-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .score-bar-track {
      width: 80px; height: 5px; background: var(--border); border-radius: 100px; overflow: hidden;
    }
    .score-bar-fill { height: 100%; border-radius: 100px; transition: width 0.5s ease; }
    .score-bar-label { font-family: 'DM Mono', monospace; font-size: 0.72rem; font-weight: 500; min-width: 36px; }

    /* ── Drug details ── */
    .drug-details {
      padding: 1rem 1rem 1.1rem;
      background: var(--surface); border-top: 1px solid var(--border);
    }
    .drug-explanation { font-size: 0.83rem; color: var(--text2); line-height: 1.65; margin-bottom: 0.75rem; text-wrap: pretty; }
    .drug-section-title {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--text3); margin-bottom: 0.5rem;
    }
    .interaction-row {
      display: flex; gap: 0.65rem; margin-bottom: 0.65rem;
      padding: 0.65rem 0.75rem; background: var(--surface2);
      border-radius: calc(var(--radius) - 4px); border: 1px solid var(--border);
    }
    .interaction-icon { font-size: 0.85rem; color: var(--text3); margin-top: 1px; flex-shrink: 0; }
    .interaction-desc { font-size: 0.8rem; color: var(--text); font-weight: 500; margin-bottom: 0.2rem; }
    .interaction-implication { font-size: 0.78rem; color: var(--text2); }
    .interaction-taxa { font-size: 0.72rem; color: var(--text3); margin-top: 0.25rem; font-style: italic; }
    .risk-flag {
      font-size: 0.78rem; color: var(--red);
      padding: 0.35rem 0.65rem; background: var(--red-bg);
      border-radius: 6px; margin-bottom: 0.35rem;
    }
    .potential-adj { font-size: 0.82rem; color: var(--text2); line-height: 1.5; }

    /* ── Microbiome ── */
    .mb-summary { font-size: 0.87rem; color: var(--text2); line-height: 1.65; margin-bottom: 1rem; text-wrap: pretty; }
    .mb-chart { display: flex; flex-direction: column; gap: 0.55rem; }
    .mb-taxon-row {
      padding: 0.65rem 0.85rem; background: var(--surface2);
      border: 1px solid var(--border); border-radius: calc(var(--radius) - 4px);
    }
    .mb-taxon-name { font-family: 'DM Mono', monospace; font-size: 0.78rem; font-weight: 500; color: var(--text); display: block; margin-bottom: 0.2rem; font-style: italic; }
    .mb-taxon-concern { font-size: 0.78rem; color: var(--text2); display: block; margin-bottom: 0.2rem; }
    .mb-taxon-drugs { font-size: 0.72rem; color: var(--accent); display: block; font-weight: 500; }

    /* ── Caveats ── */
    .caveat-row {
      display: flex; gap: 0.75rem; padding: 0.6rem 0;
      border-bottom: 1px solid var(--border); font-size: 0.82rem; color: var(--text2); align-items: flex-start;
    }
    .caveat-row:last-child { border-bottom: none; }
    .caveat-num { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text3); flex-shrink: 0; margin-top: 0.1rem; }
    .results-disclaimer {
      font-size: 0.75rem; color: var(--text3); text-align: center;
      padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); line-height: 1.6;
    }

    /* ── Error ── */
    .error-msg { font-size: 0.85rem; color: var(--red); padding: 1rem; background: var(--red-bg); border-radius: var(--radius); margin-top: 1rem; }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid var(--border); padding: 2.5rem 1.5rem;
      text-align: center;
    }
    .footer-logo { font-weight: 600; font-size: 0.9rem; color: var(--text2); margin-bottom: 0.4rem; }
    .footer-note { font-size: 0.78rem; color: var(--text3); max-width: 400px; margin: 0 auto; }

    /* ── Tabs ── */
    .tabs-bar {
      display: flex; gap: 0; border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem; overflow-x: auto;
    }
    .tab-btn {
      background: none; border: none; padding: 0.65rem 1rem;
      font-size: 0.82rem; font-weight: 500; color: var(--text3);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      white-space: nowrap; transition: color 0.15s, border-color 0.15s;
      cursor: pointer;
    }
    .tab-btn:hover { color: var(--text2); }
    .tab-btn--active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: flex; flex-direction: column; gap: 1rem; }

    /* ── Source badge ── */
    .results-header-row { display: flex; gap: 1.5rem; align-items: flex-start; justify-content: space-between; }
    .source-badge {
      display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0.3rem 0.7rem; border-radius: 100px; white-space: nowrap; margin-top: 0.15rem;
    }
    .source-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .source-live { background: var(--green-bg); color: var(--green); }
    .source-live .source-dot { background: var(--green); }
    .source-sim  { background: var(--accent-muted); color: var(--accent); }
    .source-sim  .source-dot { background: var(--accent); }

    /* ── Chart shared ── */
    .chart-subtitle { font-size: 0.82rem; color: var(--text2); line-height: 1.6; margin-bottom: 1.25rem; text-wrap: pretty; }
    .empty-state { font-size: 0.85rem; color: var(--text3); padding: 2rem; text-align: center; }

    /* ── Drug Scores Chart ── */
    .scores-chart { display: flex; flex-direction: column; gap: 0; }
    .scores-rows { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .sfr-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.6rem 0.85rem; background: var(--surface2);
      border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px);
    }
    .sfr-left { display: flex; align-items: center; gap: 0.5rem; min-width: 130px; }
    .sfr-rank { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--text3); min-width: 18px; }
    .sfr-name { font-size: 0.875rem; font-weight: 500; color: var(--text); }
    .sfr-mid { display: flex; align-items: center; gap: 0.5rem; flex: 1; }
    .sfr-track { flex: 1; height: 8px; background: var(--border); border-radius: 100px; overflow: hidden; display: flex; }
    .sfr-seg { height: 100%; }
    .sfr-seg--ortho { background: var(--accent); opacity: 0.85; }
    .sfr-seg--gus   { background: var(--amber); opacity: 0.85; }
    .sfr-score { font-family: 'DM Mono', monospace; font-size: 0.75rem; font-weight: 500; min-width: 42px; text-align: right; }
    .sfr-right { min-width: 100px; display: flex; justify-content: flex-end; }
    .score-chart-legend { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .scl-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--text2); }
    .scl-dot { width: 10px; height: 10px; border-radius: 2px; }
    .scl-dot--ortho { background: var(--accent); opacity: 0.85; }
    .scl-dot--gus   { background: var(--amber); opacity: 0.85; }
    .scl-note { font-size: 0.75rem; color: var(--text3); flex-basis: 100%; }

    /* ── Taxa Chart ── */
    .taxa-chart { display: flex; flex-direction: column; gap: 0; }
    .phyla-legend { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
    .phylum-chip {
      font-size: 0.72rem; font-weight: 500; padding: 0.2rem 0.6rem;
      border-radius: 100px; border: 1px solid;
    }
    .taxa-rows { display: flex; flex-direction: column; gap: 0.4rem; }
    .taxon-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 0.75rem; background: var(--surface2);
      border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px);
    }
    .taxon-left { display: flex; align-items: center; gap: 0.5rem; min-width: 220px; flex-shrink: 0; }
    .taxon-name { font-family: 'DM Mono', monospace; font-size: 0.78rem; font-style: italic; color: var(--text); }
    .taxon-flags { display: flex; gap: 0.3rem; }
    .taxon-flag {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.04em;
      padding: 0.12rem 0.4rem; border-radius: 4px;
    }
    .taxon-flag--gus { background: var(--amber-bg); color: var(--amber); }
    .taxon-flag--cyp { background: var(--accent-muted); color: var(--accent); }
    .taxon-right { display: flex; align-items: center; gap: 0.5rem; flex: 1; }
    .taxon-bar-track { flex: 1; height: 7px; background: var(--border); border-radius: 100px; overflow: hidden; }
    .taxon-bar-fill { height: 100%; border-radius: 100px; transition: width 0.5s ease; }
    .taxon-pct { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--text3); min-width: 36px; text-align: right; }

    /* ── Network graph ── */
    .network-wrap { display: flex; flex-direction: column; gap: 0.75rem; }
    .network-svg-container {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem; overflow: hidden;
    }
    .network-legend { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: center; }
    .nl-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--text2); }
    .nl-line { width: 20px; height: 2.5px; border-radius: 2px; display: inline-block; }

    /* ── Raw output ── */
    .raw-panel { display: flex; flex-direction: column; gap: 0.5rem; }
    .raw-accordion { border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); overflow: hidden; }
    .raw-acc-header {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 0.75rem 1rem; background: var(--surface2); border: none;
      font-family: inherit; font-size: 0.85rem; font-weight: 500; color: var(--text);
      cursor: pointer; transition: background 0.15s;
    }
    .raw-acc-header:hover { background: var(--accent-muted); }
    .raw-acc-toggle { color: var(--text3); font-size: 1.1rem; }
    .raw-json {
      padding: 1rem; background: var(--bg); overflow-x: auto;
      font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--text2);
      line-height: 1.6; max-height: 400px; overflow-y: auto;
      border-top: 1px solid var(--border);
    }

    /* ── Tweaks panel ── */
    .tweaks-panel {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow);
      width: 240px;
    }
    .tweaks-title { font-size: 0.8rem; font-weight: 600; color: var(--text); margin-bottom: 1rem; }
    .tweak-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.5rem; margin-bottom: 0.75rem; font-size: 0.8rem; color: var(--text2);
    }
    .tweak-row input[type=range] { flex: 1; accent-color: var(--accent); }
    .tweak-row select {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 6px; font-size: 0.78rem; color: var(--text);
      font-family: inherit;
    }
    .tweak-val { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--text3); min-width: 28px; text-align: right; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .agents-row { flex-direction: column; }
      .agent-arrow { transform: rotate(90deg); align-self: flex-start; margin-left: 0.85rem; }
      .score-bar-track { width: 56px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="demo-data.js"></script>
  <script type="text/babel" src="results.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
